<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إلى حورية، بكل الحب</title>
<meta name="theme-color" content="#efa7bd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حورية">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4f7;--card:#fff;--ink:#26304a;--mute:#666b84;--bur:#1f4f99;--rose:#efa7bd;--gold:#efa7bd;--line:#f4d6e0;--on:#fff;--blue:#2f6fc4;--glow:rgba(239,167,189,.35);--tint:rgba(239,167,189,.22);box-sizing:border-box;padding:env(safe-area-inset-top,0) 0 0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a2b;--card:#222741;--ink:#f6eaf0;--mute:#b9bdd4;--bur:#a9ccf7;--line:#363c5e;--on:#14172a;--blue:#8db8f2;--glow:rgba(239,167,189,.16);--tint:rgba(239,167,189,.14)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0)}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(ellipse 90% 380px at 50% 0,var(--glow),transparent);background-repeat:no-repeat;color:var(--ink);font:400 17px/1.9 "IBM Plex Sans Arabic",Tahoma,sans-serif;padding-bottom:92px}
main{max-width:640px;margin:0 auto;padding:28px 20px}.pg.in{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1,h2{font-weight:600;color:var(--bur);line-height:1.5;margin:0 0 8px}h1{font-size:2rem}h2{font-size:1.4rem}
p{margin:0 0 14px}.mute{color:var(--mute);font-size:.95rem}
.card,.btn{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin:0 0 12px;color:inherit;font:inherit;text-decoration:none;box-shadow:0 4px 18px rgba(47,111,196,.09)}
button.card,.btn{cursor:pointer;transition:transform .2s,border-color .2s}
button.card:hover,.btn:hover{transform:translateY(-2px);border-color:var(--blue)}.card{border-inline-start:3px solid var(--rose)}.hero{background:linear-gradient(135deg,var(--tint),var(--card))}.seal{background:linear-gradient(160deg,var(--tint),transparent);border:1px solid var(--line);border-radius:24px;padding:24px 12px;margin-bottom:16px}
.btn{display:inline-block;width:auto;text-align:center;background:var(--bur);color:var(--on);border-color:var(--bur);padding:9px 20px;margin:0 6px 0 0}
.btn.ghost{background:none;color:var(--blue);border-color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.letter{background:var(--card);border:1px solid var(--line);border-radius:6px 6px 22px 22px;padding:30px 24px;box-shadow:0 10px 30px rgba(47,111,196,.12);white-space:pre-wrap;overflow-wrap:anywhere;border-top:4px double var(--rose)}
.ey{color:var(--blue);letter-spacing:.08em;font-size:.85rem}
.row{display:flex;gap:8px;align-items:center;margin:16px 0;flex-wrap:wrap}
.chips{display:flex;gap:8px;margin:14px 0}.chip{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:4px 16px;font:inherit;cursor:pointer}.chip[aria-pressed=true]{background:var(--blue);color:var(--on);border-color:var(--blue)}
.wish{display:flex;gap:14px;align-items:flex-start}.wish input{width:24px;height:24px;accent-color:var(--blue);margin-top:6px}
.wish.done{opacity:.6}.wish.done b{text-decoration:line-through;text-decoration-color:var(--rose)}
.empty{text-align:center;padding:36px 16px;border:1px dashed var(--line);border-radius:18px;color:var(--mute)}
.env{font-size:4rem;text-align:center;margin:10px 0;color:var(--blue)}.count{display:flex;gap:10px;justify-content:center;direction:ltr;margin:18px 0}
.count div{background:var(--card);border:1px solid var(--rose);border-radius:14px;padding:10px 14px;min-width:64px;text-align:center;font-size:1.5rem;color:var(--blue)}.count small{display:block;font-size:.7rem;color:var(--mute)}
nav{position:fixed;inset:auto 0 0;background:var(--card);border-top:2px solid var(--rose);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0))}
nav a{flex:1;text-align:center;font-size:.78rem;line-height:1.4;padding:6px 2px;color:var(--mute);text-decoration:none;border-radius:12px}nav a[aria-current=page]{color:var(--blue);font-weight:600;background:var(--tint)}
footer{text-align:center;color:var(--mute);font-size:.9rem;margin-top:30px}
.open{animation:rev 1.2s ease}@keyframes rev{from{opacity:0;transform:scale(.96) translateY(14px);filter:blur(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#splash{position:fixed;inset:0;z-index:99;background-color:var(--bg);background-image:radial-gradient(ellipse 90% 380px at 50% 0,var(--glow),transparent);background-repeat:no-repeat;display:grid;place-items:center;cursor:pointer;transition:opacity .4s ease,visibility .4s}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:min(54vw,230px);height:auto;aspect-ratio:1;border-radius:26%;box-shadow:0 18px 44px rgba(47,111,196,.25),0 0 0 1px rgba(255,255,255,.5);animation:logo .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes logo{from{opacity:0;transform:scale(.9) translateY(8px)}}
</style>
</head>

const TZ='Africa/Algiers',$=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch{return null}};
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date());
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const rng=a=>()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* رسالة اليوم: حتمية — نفس اليوم ⇒ نفس الرسالة على أي جهاز، بلا تكرار حتى تنتهي الدورة */
function dailyFor(day){
 const items=CONTENT.daily.items.filter(m=>m.status==='published');
 let d=new Date(CONTENT.daily.start+'T00:00:00Z'),end=new Date(day+'T00:00:00Z'),used=new Set(),rot=0,pick=null,last=null;
 for(;d<=end;d.setUTCDate(d.getUTCDate()+1)){
  pick=null;const ds=d.toISOString().slice(0,10),el=items.filter(m=>m.from<=ds);if(!el.length)continue;
  let pool=el.filter(m=>!used.has(m.id));
  if(!pool.length){used=new Set();rot++;pool=el.length>1?el.filter(m=>m.id!==last):el}
  pick=pool[Math.floor(rng(hash(ds+'|'+rot))()*pool.length)];used.add(pick.id);last=pick.id}
 return pick}

const letter=(m,eyebrow)=>`<article class="letter"><div class="ey">${esc(eyebrow)}</div>${m.title?`<h2>${esc(m.title)}</h2>`:''}<p>${esc(m.body)}</p></article>`;
const empty=t=>`<div class="empty">${t}</div>`;
const back=h=>`<p><a class="btn ghost" href="${h}">رجوع</a></p>`;
let mi=0,timer;

const views={
 home(){const t=dailyFor(today()),cap=capState();
  return `<p class="ey">${new Intl.DateTimeFormat('ar-DZ',{timeZone:TZ,dateStyle:'full'}).format(new Date())}</p>
  <h1>يومًا ما لن تعني هذه المسافات شيئًا</h1><p class="mute">${esc(CONTENT.intro)}</p>
  <a class="card hero" href="#/daily"><span class="ey">رسالة اليوم</span><br>${t?esc(t.title||'اقرئي رسالة اليوم'):'ستصلكِ رسالة قريبًا'}</a>
  <a class="card" href="#/moods"><b>رسائل حسب حالتكِ</b><br><span class="mute">اختاري ما تشعرين به الآن</span></a>
  <a class="card" href="#/wishes"><b>أشياء أريد أن أفعلها معكِ</b><br><span class="mute">أحلام صغيرة وكبيرة</span></a>
  <a class="card" href="#/capsule"><b>كبسولة عيد ميلادكِ</b><br><span class="mute">${cap.open?'فُتحت لكِ ✦':cap.soon?'تقترب… ✦':'تنتظركِ'}</span></a>
  <footer>${esc(CONTENT.signature)}</footer>`},
 daily(){const t=dailyFor(today());
  return `<p class="ey">رسالة اليوم</p>`+(t?letter(t,'لكِ اليوم')+`<p class="mute">رسالة جديدة غدًا، بتوقيت الجزائر.</p>`:empty('لا توجد رسالة لليوم بعد.<br>ستصلكِ قريبًا.'))+back('#/')},
 moods(p){
  if(!p){return `<h2>رسائل حسب حالتكِ</h2><p class="mute">اختاري ما يناسب قلبكِ الآن.</p>`+CONTENT.categories.map(c=>`<a class="card" href="#/moods/${esc(c.id)}">${esc(c.title)}</a>`).join('')+back('#/')}
  const c=CONTENT.categories.find(x=>x.id===p),L=CONTENT.messages.filter(m=>m.cat===p&&m.status==='published');
  if(!c)return empty('هذا القسم غير موجود.')+back('#/moods');
  const fav=store('fav')||[];mi=Math.min(mi,Math.max(L.length-1,0));const m=L[mi];
  return `<h2>${esc(c.title)}</h2>`+(m?letter(m,`${mi+1} من ${L.length}`)+`<div class="row">
   <button class="btn ghost" data-a="prev" ${mi?'':'disabled'}>السابقة</button><button class="btn ghost" data-a="next" ${mi<L.length-1?'':'disabled'}>التالية</button>
   <button class="btn ghost" data-a="fav" data-id="${esc(m.id)}" aria-pressed="${fav.includes(m.id)}">${fav.includes(m.id)?'♥ في المفضلة':'♡ أحببتها'}</button></div>`
   :empty('لم تُكتب هنا رسائل بعد.<br>سيأتي ما يليق بهذه اللحظة.'))+back('#/moods')},
 wishes(){const done=store('done')||[],f=store('wf')||'all',L=CONTENT.wishes.filter(w=>w.status==='published').filter(w=>f==='all'||(f==='done')===done.includes(w.id));
  const chip=(k,t)=>`<button class="chip" data-a="filter" data-id="${k}" aria-pressed="${f===k}">${t}</button>`;
  return `<h2>أشياء أريد أن أفعلها معكِ</h2><p class="mute">بلا استعجال — كل شيء في وقته.</p><div class="chips">${chip('all','الكل')}${chip('todo','ننتظرها')}${chip('done','تحققت')}</div>`+
  (L.length?L.map(w=>`<label class="card wish ${done.includes(w.id)?'done':''}"><input type="checkbox" data-a="wish" data-id="${esc(w.id)}" ${done.includes(w.id)?'checked':''}><span><b>${esc(w.title)}</b>${w.cat?`<br><span class="ey">${esc(w.cat)}</span>`:''}${w.desc?`<br><span class="mute">${esc(w.desc)}</span>`:''}</span></label>`).join(''):empty('لا شيء هنا بعد.'))+back('#/')},
 capsule(){const c=CONTENT.capsule,s=capState();

  return `<div class="seal"><div class="env" aria-hidden="true">✉</div><h2 style="text-align:center">${esc(c.title)}</h2><p class="mute" style="text-align:center">شيء خاص ينتظركِ، وما زال مختومًا.</p><div class="count" id="cd" role="timer"></div></div>`+back('#/')}
};
function capState(){const t=new Date(CONTENT.capsule.opens)-Date.now();return{open:t<=0,soon:t>0&&t<7*864e5,ms:t}}
function tick(){const el=$('#cd');if(!el)return;const s=capState();if(s.open)return route();let r=Math.floor(s.ms/1000);
 const u=[['يوم',86400],['ساعة',3600],['دقيقة',60],['ثانية',1]];el.innerHTML=u.map(([n,k])=>{const v=Math.floor(r/k);r%=k;return`<div>${v}<small>${n}</small></div>`}).join('')}
function route(anim){clearInterval(timer);const[,v='home',p]=location.hash.slice(1).split('/'),fn=views[v]||views.home;
 app.innerHTML=`<div class="pg${anim?' in':''}">${fn(p)}</div>`;document.querySelector('nav').innerHTML=[['','الرئيسية'],['moods','حسب حالتكِ'],['daily','اليوم'],['wishes','أمنياتنا'],['capsule','الكبسولة']]
  .map(([h,t])=>`<a href="#/${h}" ${(v||'')===h||(h===''&&!views[v])?'aria-current="page"':''}>${t}</a>`).join('');

addEventListener('hashchange',()=>{mi=0;route(true);scrollTo(0,0)});

(()=>{const s=$('#splash');if(!s)return;const ui=[...document.querySelectorAll('main,nav')];ui.forEach(e=>e.inert=true);
 const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;let done=false;
 const end=()=>{if(done)return;done=true;ui.forEach(e=>e.inert=false);route(true);s.classList.add('out');setTimeout(()=>s.remove(),500)};
 s.addEventListener('click',end);setTimeout(end,rm?600:1400)})();
</script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http")){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
